# Nix Configuration Tasks

# eval-cache off: user.nix is skip-worktree, so a cached evaluation can hide its edits.
[tasks.check-personal]
description = "Build the personal darwin configuration without applying"
run = "nix build --no-link --option eval-cache false .#darwinConfigurations.personal.system"

[tasks.check-work]
description = "Build the work darwin configuration without applying"
run = "nix build --no-link --option eval-cache false .#darwinConfigurations.work.system"

[tasks.check-llm-server]
description = "Build the personal configuration with the LLM server role forced on (never true in this machine's user.nix)"
run = "nix build --no-link --option eval-cache false .#darwinConfigurations.personal-llm-server.system"

[tasks.update]
description = "Update flake inputs"
run = "nix flake update"

[tasks.homebrew-upgrade]
description = "Upgrade installed Homebrew packages"
run = """
before=$(readlink /opt/homebrew/opt/ollama 2>/dev/null || true)
status=0
# The config sets onActivation.autoUpdate = false, so without an explicit update the local
# formula index never moves and `brew upgrade` is a silent no-op (bit us: ollama stuck at
# 0.30.10, rejecting new model formats with a 412).
brew update || status=$?
brew upgrade --greedy || status=$?  # mise runs this with errexit; keep going to the restart
# A running `ollama serve` keeps paths into the keg brew just removed; restart it only if the keg moved.
after=$(readlink /opt/homebrew/opt/ollama 2>/dev/null || true)
if [ "$before" != "$after" ]; then
  launchctl kickstart -k "gui/$(id -u)/org.nix-community.home.ollama" || { echo "ollama moved to $after but the agent did not restart; run: launchctl kickstart -k gui/$(id -u)/org.nix-community.home.ollama" >&2; status=1; }
fi
exit $status
"""

[tasks.ca]
description = "Send the homelab CA certificate with native AirDrop"
run = "./scripts/airdrop-homelab-ca.sh"

[tasks.ai-update]
description = "Update ai flake input submodule to latest"
run = "nix flake update ai"

[tasks.ai-plugins-update]
description = "Update all Claude Code marketplaces and plugins"
run = "./scripts/ai-plugins-update.sh"

[tasks.pkg-update]
description = "Update all local packages in pkgs/ (interactive with Claude)"
run = "claude 'Use the pkg-update skill to update all packages in pkgs/'"

[tasks.pkg-update-script]
description = "Update all local packages in pkgs/ with the repo script"
run = "./scripts/pkg-update.sh"
